# CFDOF_GUIDE.md Part 8's check: the droplets through Ben's two carrier designs beside the bare Chamber_v2 (the
# 2026-11-02 baseline, guide 7.10). Both designs are Chamber_v2 plus a carrier inlet on the x = 80 wall at y 210,
# z -100 (30 L/min, beside the spray) and, in line with it on the x = 270 wall, a capture: a 50 mm cone into a 10 mm
# pipe. The 44 mm port is sealed (Ben's layout, 2026-11-12):
#   Stream: the carrier through a 10 mm hole (6.4 m/s, 3.8 mN: a jet straight into the capture, push-pull)
#   Gentle: the same 30 L/min through a 40 mm hole (0.4 m/s, 0.24 mN: the same through-flow, no jet)
# 'port' in the tables is the capture port for the two designs, and the 44 mm port for Chamber_v2.
# Run it with run_droplets.py (README.md, "Droplets through the CFD flow"). ~6 h, unattended (estimated: seven
# flows, ~2.5 h per three): the 290 s runs each track ~5 minutes of flow (~15 s of computing per second of flow,
# measured 2026-11-02).
#
# A sweep: everything comes from the base file; each entry below changes only what it names (mappings merge).

base: droplets_baseline.yaml
name: carrier stream                         # the run's folder: droplet_runs/<date>_<time>_carrier_stream/

slide_test:
  flow_after_switch_off_s: !design [2, 290]  # 2 s: the spray and carrier stop together after the 5 s spray, as in
                                             #   the slide test. 290 s: continuous running into the AJP (Ben,
                                             #   2026-11-13). The droplets don't touch each other or the flow, so a
                                             #   continuous spray is many 5 s pulses added up, and each droplet's
                                             #   eventual fate is the answer. 290 s is ~5 chamber volumes (35 L /
                                             #   38.6 L/min = 55 s each), leaving <1 % of the well-mixed fines
                                             #   airborne (120 s left ~1/9); it ends with 10 s of still air at the
                                             #   rig's 300 s (settle_s), which the 2 s run keeps as the slide test

sweep:
  show: gusts_on_after_290s                  # the run the comparison's maps and size curves show
  against: Chamber_v2                        # the reference: the bare chamber, the 44 mm port open
  tolerance: {floor_pp: 5, centre_mm: 10, spread_mm: 10, moved_pct: 10}
  runs:
    - label: Chamber_v2
      flow:
        case: ~/OpenFOAM/cfdof_cases/Chamber_v2/case   # guide Part 7
        iteration: 2000
        spray_patch: spray
        port_patches: [outlet]                   # the 44 mm port
      spray:
        hole_mm: !design [163.7, 237.79, -212.5]   # the lip: where the 1.11 mm bore meets the 70 degree point
    # Neither design converges: the flow differs locally by 30-55 % between snapshots, and the share of the
    # capture's air coming straight from Stream's carrier is 0 % at 2,000 and 4,000 but 62 % at 3,000 (guide 8.10).
    # So each design runs at 2,000, 3,000 and 4,000, and the spread is the uncertainty (Ben, 2026-11-13).
    - label: Stream 2000
      flow:
        case: ~/OpenFOAM/cfdof_cases/Chamber_v2_stream_30/case   # guide Part 8, 8.1-8.6
        iteration: 2000
        spray_patch: spray
        port_patches: [capture]                  # the capture pipe's end on the x = 270 side
      spray:
        hole_mm: !design [163.7, 237.79, -212.5]
    - label: Stream 3000
      flow:
        case: ~/OpenFOAM/cfdof_cases/Chamber_v2_stream_30/case
        iteration: 3000                          # the snapshot where the jet goes straight in
        spray_patch: spray
        port_patches: [capture]
      spray:
        hole_mm: !design [163.7, 237.79, -212.5]
    - label: Stream 4000
      flow:
        case: ~/OpenFOAM/cfdof_cases/Chamber_v2_stream_30/case
        iteration: 4000
        spray_patch: spray
        port_patches: [capture]
      spray:
        hole_mm: !design [163.7, 237.79, -212.5]
    - label: Gentle 2000
      flow:
        case: ~/OpenFOAM/cfdof_cases/Chamber_v2_gentle_30/case   # guide Part 8, 8.7
        iteration: 2000
        spray_patch: spray
        port_patches: [capture]
      spray:
        hole_mm: !design [163.7, 237.79, -212.5]
    - label: Gentle 3000
      flow:
        case: ~/OpenFOAM/cfdof_cases/Chamber_v2_gentle_30/case
        iteration: 3000
        spray_patch: spray
        port_patches: [capture]
      spray:
        hole_mm: !design [163.7, 237.79, -212.5]
    - label: Gentle 4000
      flow:
        case: ~/OpenFOAM/cfdof_cases/Chamber_v2_gentle_30/case
        iteration: 4000
        spray_patch: spray
        port_patches: [capture]
      spray:
        hole_mm: !design [163.7, 237.79, -212.5]

run:
  parallel: 10                               # the runs and checks of each entry at once (15 cores)
